name: Chainbot CI/CD

# on push to test branch, run the tests
on:
  push:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ --cov=data --cov=bot --cov=llm --cov=persona --cov-report=term-missing --disable-warnings

