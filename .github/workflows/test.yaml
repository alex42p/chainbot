name: Chainbot CI/CD

# on push to test branch, run the tests
on:
  push:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_SCRAPER_CLIENT_ID: ${{ secrets.DISCORD_SCRAPER_CLIENT_ID }}
      DISCORD_SCRAPER_TOKEN: ${{ secrets.DISCORD_SCRAPER_TOKEN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_KEY: ${{ secrets.S3_KEY }}
      USER_ID: ${{ secrets.USER_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ --cov=data --cov=bot --cov=llm --cov=persona --cov-report=term-missing --disable-warnings

